# Convergence probe before Phase 2: how many steps does reward-only PPO (M1)
# need on 8 hosts when trained on 16 or 32 networks? This file: 1M steps.
out: results/phase1/converge/1m
scenario_root: scenarios

grid:
  num_hosts: [8]
  methods: [M1]
  k: [16, 32]
  seeds: [0, 1, 2]

step_limit: {8: 100}
total_steps: {8: 1000000}

methods:
  M1: {algo: ppo, cost_penalty: 0.0}

ppo:
  num_envs: 8
  num_steps: 128
  learning_rate: 0.0003
  anneal_lr: false
  gamma: 0.99
  gae_lambda: 0.95
  update_epochs: 4
  num_minibatches: 4
  clip_coef: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  hidden: 64

eval:
  sampled_episodes_per_network: 10
